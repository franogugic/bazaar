services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bazaar-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-bazaar}
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - bazaar-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bazaar} -d ${POSTGRES_DB:-bazaar}"]
      interval: 5s
      timeout: 3s
      retries: 10
      
  api:
    build:
      context: ./src/Bazaar.Api
    environment:
      ConnectionStrings__Default:
        Host=db;Port=5432;Database=${POSTGRES_DB:-bazaar};Username=${POSTGRES_USER:-bazaar};Password=${POSTGRES_PASSWORD:-bazaar-dev-password}
      Jwt__Key:
        ${JWT_KEY:-local-dev-only-jwt-key-change-in-env-file}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
  
volumes:
  bazaar-db: